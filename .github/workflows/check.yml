name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # `pnpm install` already builds, via `prepare`, so a broken emit fails
      # above. This checks the thing the build cannot: that the subpaths in
      # package.json match the package that came out of it.
      - run: pnpm assert:exports
